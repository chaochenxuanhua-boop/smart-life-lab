name: Deploy Hugo Blog to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.139.4"
          extended: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site with Hugo
        working-directory: ./site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          HUGO_PARAMS_RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID || vars.RAKUTEN_AFFILIATE_ID || '' }}
          HUGO_PARAMS_MOSHIMO_AMAZON_ID: ${{ secrets.MOSHIMO_AMAZON_ID || vars.MOSHIMO_AMAZON_ID || '' }}
          HUGO_PARAMS_AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG || vars.AMAZON_ASSOCIATE_TAG || '' }}
          HUGO_RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID || vars.RAKUTEN_AFFILIATE_ID || '' }}
          HUGO_MOSHIMO_AMAZON_ID: ${{ secrets.MOSHIMO_AMAZON_ID || vars.MOSHIMO_AMAZON_ID || '' }}
          HUGO_AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG || vars.AMAZON_ASSOCIATE_TAG || '' }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || vars.SITE_BASE_URL || steps.pages.outputs.base_url }}
        run: |
          CLEAN_BASE_URL="${SITE_BASE_URL%/}/"
          hugo --gc --minify --baseURL "${CLEAN_BASE_URL}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
